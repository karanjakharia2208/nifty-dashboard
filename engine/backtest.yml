name: nifty-backtest-19y

on:
  schedule:
    # Saturdays 04:33 UTC (10:03 IST): refresh the long daily-bar backtest
    - cron: "33 4 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nifty-engine
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install dependencies
        run: pip install -r engine/requirements.txt
      - name: Restore the data branch
        run: |
          mkdir -p out
          if git fetch origin data:data 2>/dev/null; then
            for f in $(git ls-tree --name-only data); do
              git show data:$f > out/$f 2>/dev/null || true
            done
          fi
          for f in out/*.json; do [ -s "$f" ] || rm -f "$f"; done
      - name: Run the 19-year daily-bar backtest
        run: python engine/backtest_daily.py --out out
      - name: Publish results to the data branch
        run: |
          cd out
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name="nifty-engine" -c user.email="nifty-engine@users.noreply.github.com" \
            commit -qm "backtest $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
